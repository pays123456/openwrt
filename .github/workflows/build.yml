name: Build GL-MT3600BE (OpenWrt 25.12 + FanchmWrt)

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "OpenWrt 基线标签 (仅用于命名/展示)"
        default: "openwrt-25.12"
        required: false
      config_file:
        description: "defconfig 相对仓库根的路径"
        default: "gl-mt3600be.defconfig"
        required: false
      upload_release:
        description: "是否发布到 Releases"
        default: "false"
        required: false
  push:
    branches: [gl-mt3600be-fanchm, main]
    paths:
      - "gl-mt3600be.defconfig"
      - "feeds.conf.default"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [openwrt-25.12]
    paths:
      - "gl-mt3600be.defconfig"
      - "feeds.conf.default"
  schedule:
    - cron: "5 2 * * 1"

env:
  BASE_REPO: https://github.com/openwrt/openwrt.git
  BASE_REF: ${{ github.event.inputs.base_ref || 'openwrt-25.12' }}
  CONFIG_FILE: ${{ github.event.inputs.config_file || 'gl-mt3600be.defconfig' }}
  FANCHM_PKG_REPO: https://github.com/fanchmwrt/fanchmwrt-packages.git
  FANCHM_PKG_BRANCH: main
  DEVICE: glinet_gl-mt3600be
  TARGET: mediatek
  SUBTARGET: filogic
  TZ: Asia/Shanghai

jobs:
  validate:
    name: 离线校验
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 运行校验器
        run: |
          set -e
          for f in validate.sh check_config.py kconfig_check.py validate-workflow.py; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.sh ]]; then bash "$f"; else python3 "$f"; fi
            else
              echo "::warning::$f 不存在, 跳过"
            fi
          done

  build:
    name: 构建固件
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: 显示编译目标
        run: |
          echo "DEVICE=${{ env.DEVICE }}"
          echo "TARGET=${{ env.TARGET }}/${{ env.SUBTARGET }}"
          echo "BASE_REF=${{ env.BASE_REF }}"
          git describe --tags --always 2>/dev/null || true

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                     "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android \
                     /var/lib/docker /var/cache/apt/archives
          df -h

      - name: 安装构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev zlib1g-dev \
            python3 python3-dev python3-venv rsync unzip file wget \
            ccache curl cmake device-tree-compiler
          echo "gcc: $(gcc --version | head -1)"

      - name: 校验 GL-MT3600BE 原生支持
        run: |
          if ! grep -rqE "gl-mt3600be|gl_mt3600be" target/linux/mediatek/; then
            echo "::error::当前 checkout 未含 GL-MT3600BE 支持"
            exit 1
          fi
          echo "GL-MT3600BE 支持已确认"

      - name: 配置 feeds
        run: |
          [ -f feeds.conf.default ] || touch feeds.conf.default
          grep -q "src-git fanchmwrt" feeds.conf.default || cat >> feeds.conf.default <<EOF
          src-git fanchmwrt ${FANCHM_PKG_REPO};${FANCHM_PKG_BRANCH}
          EOF
          cp feeds.conf.default feeds.conf
          cat feeds.conf

      - name: DIY part1
        run: |
          if [ -f scripts/diy-part1.sh ]; then
            bash scripts/diy-part1.sh "$PWD"
          else
            echo "::warning::scripts/diy-part1.sh 不存在"
          fi

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ls package/feeds/ | grep -i fanch || true

      - name: 覆盖 files/
        run: |
          if [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
            cp -rf files/. ./
            ls -l usr/libexec/package-manager-call 2>/dev/null || true
          fi

      - name: 载入 defconfig
        run: |
          [ -f "$CONFIG_FILE" ] || { echo "::error::$CONFIG_FILE 不存在"; exit 1; }
          cp "$CONFIG_FILE" .config
          make defconfig
          grep -E "CONFIG_PACKAGE_(libfwx_common|fwx|fwxd|fullconenat|luci-app-fwx|luci-theme-fanchmwrt)=" .config || true

      - name: DIY part2
        run: |
          for SCRIPT in scripts/diy-part2-fanchm.sh scripts/diy-part2.sh; do
            if [ -f "$SCRIPT" ]; then
              bash "$SCRIPT" "$PWD"
              break
            fi
          done
          echo "::warning::无 diy-part2 脚本, 跳过"

      - name: 下载依赖源码
        continue-on-error: true
        run: make download -j"$(nproc)" V=s

      - name: 编译固件
        id: compile
        run: |
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 10G || true
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" > "$GITHUB_OUTPUT"

      - name: 编译失败诊断
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "=== build.log 末尾 120 行 ==="
          tail -n 120 build.log
          echo "=== 疑似错误点 ==="
          grep -nE "error:|Error |ERROR:|failed to build|Package.*not found" build.log | tail -40 || true

      - name: 收集产物
        if: success()
        run: |
          OUT="bin/targets/mediatek/filogic"
          mkdir -p artifacts
          cp "$OUT"/*${DEVICE}*sysupgrade* artifacts/ 2>/dev/null || true
          cp "$OUT"/*${DEVICE}*.manifest artifacts/ 2>/dev/null || true
          cp "$OUT"/sha256sums artifacts/ 2>/dev/null || true
          cp .config "artifacts/config-${DEVICE}.txt" 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: 计算 SHA256
        if: success()
        working-directory: artifacts
        run: |
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: 上传 Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt3600be-firmware-${{ env.BASE_REF }}-${{ github.sha }}
          path: artifacts/
          retention-days: 30

      - name: 发布 Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            GL-MT3600BE 固件 (OpenWrt ${{ env.BASE_REF }} + FanchmWrt main)
            - 基础: ${{ env.BASE_REF }}
            - Fanchm 增量: fwx / fwxd / libfwx_common / fullconenat-nft / luci-theme-fanchmwrt
            - 提交: ${{ github.sha }}
            - 用法: 首次建议 U-Boot recovery, Web 升级请取消 '保留配置'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: 汇总
    needs: [validate, build]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: 结果
        run: |
          echo "validate: ${{ needs.validate.result }}"
          echo "build:   ${{ needs.build.result }}"
